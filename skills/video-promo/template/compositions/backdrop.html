<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* LOCKED: the warm dark ground and a few pixels that step slowly, so no moment is frozen. */
        #root { position: absolute; inset: 0; background: #171412; }
        #root .px { position: absolute; width: 24px; height: 24px; background: #4a4038; }
      </style>
      <div id="root" data-composition-id="backdrop" data-width="1080" data-height="1920">
        <div class="px" id="bd-px1" style="left: 72px; top: 132px"></div>
        <div class="px" id="bd-px2" style="left: 108px; top: 168px"></div>
        <div class="px" id="bd-px3" style="left: 948px; top: 1716px"></div>
        <div class="px" id="bd-px4" style="left: 984px; top: 1752px"></div>
        <div class="px" id="bd-px5" style="left: 912px; top: 1752px"></div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.to("#bd-px1", { x: 36, duration: 20, ease: "steps(6)" }, 0);
          tl.to("#bd-px2", { y: 36, duration: 20, ease: "steps(6)" }, 0);
          tl.to("#bd-px3", { y: -36, duration: 20, ease: "steps(6)" }, 0);
          tl.to("#bd-px4", { x: -36, duration: 20, ease: "steps(6)" }, 0);
          tl.to("#bd-px5", { y: -72, duration: 20, ease: "steps(12)" }, 0);
          window.__timelines["backdrop"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

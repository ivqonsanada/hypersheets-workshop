<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* LOCKED: do not edit the style. Change only the text inside the tags marked data-slot. */
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+20A0-20AB, U+2C60-2C7F, U+A720-A7FF; }
        #root { position: absolute; inset: 0; font-family: "Finlandica", sans-serif; color: var(--hs-ink, #f4ede4); background: var(--hs-accent, #e44d26); }
        #root .wrap { position: absolute; left: 96px; right: 120px; top: 240px; bottom: 300px; display: flex; flex-direction: column; justify-content: center; }
        #root .line { font-size: 60px; font-weight: 500; line-height: 1.2; }
        #root .name { font-size: 144px; font-weight: 700; line-height: 1.04; letter-spacing: -0.01em; margin-top: 20px; overflow-wrap: normal; }
        #root .bar { margin-top: 72px; display: flex; align-items: center; height: 112px; padding: 0 28px; border: 6px solid var(--hs-ink, #f4ede4); box-shadow: 12px 12px 0 color-mix(in srgb, var(--hs-accent, #e44d26) 45%, #000000); }
        #root .url { font-family: "JetBrains Mono", monospace; font-size: 48px; white-space: nowrap; overflow: hidden; }
        #root .caret { flex: none; display: block; width: 0.42em; height: 1.1em; margin-left: 6px; font-size: 48px; background: var(--hs-ink, #f4ede4); }
        #root .btn-box { margin-top: 88px; height: 160px; }
        #root .press { position: relative; display: inline-block; padding-bottom: 14px; }
        #root .edge { position: absolute; left: 0; right: 0; top: 14px; bottom: 0; background: color-mix(in srgb, var(--hs-accent, #e44d26) 45%, #000000); }
        #root .btn { position: relative; display: inline-block; background: var(--hs-ink, #f4ede4); color: var(--hs-accent, #e44d26); font-size: 56px; font-weight: 700; line-height: 1; padding: 36px 60px; }
      </style>
      <div id="root" data-composition-id="visit" data-width="1080" data-height="1920">
        <div class="wrap" id="visit-in">
          <p class="line" id="visit-line" data-layout-allow-safe-zone data-slot="visit-line" data-max="28">Mampir ke halamanku</p>
          <p class="name" id="visit-name" data-layout-allow-safe-zone data-slot="name-again" data-max="20">TODO-name</p>
          <div class="bar" id="visit-bar"><span class="url" id="visit-url" data-layout-allow-safe-zone data-slot="address-again" data-max="34">TODO-address</span><b class="caret" id="visit-caret"></b></div>
          <div class="btn-box" id="visit-box"><span class="press"><span class="edge"></span><span class="btn" id="visit-btn" data-layout-allow-safe-zone data-slot="button" data-max="18">Buka halamannya</span></span></div>
        </div>
      </div>
      <script src="compositions/visit.js"></script>
    </template>
  </body>
</html>

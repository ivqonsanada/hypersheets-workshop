<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* LOCKED: do not edit the style. Change only the text inside the tags marked data-slot. */
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+20A0-20AB, U+2C60-2C7F, U+A720-A7FF; }
        #root { position: absolute; inset: 0; font-family: "Finlandica", sans-serif; color: #f4ede4; }
        #root .wrap { position: absolute; left: 120px; right: 140px; top: 240px; bottom: 270px; display: flex; flex-direction: column; justify-content: center; }
        #root .line { font-size: 60px; font-weight: 500; color: #c2b5a6; line-height: 1.2; }
        #root .name { font-size: 112px; font-weight: 700; line-height: 1.05; margin-top: 16px; overflow-wrap: anywhere; }
        #root .url { font-family: "JetBrains Mono", monospace; font-size: 44px; color: hsl(217 91% 72%); margin-top: 56px; overflow-wrap: anywhere; line-height: 1.3; }
        #root .btn-box { margin-top: 96px; height: 160px; }
        #root .btn { display: inline-block; background: #e44d26; color: #ffffff; font-size: 56px; font-weight: 700; line-height: 1; padding: 36px 60px; box-shadow: 0 14px 0 #b5381b; }
      </style>
      <div id="root" data-composition-id="visit" data-width="1080" data-height="1920">
        <div class="wrap" id="visit-in">
          <p class="line" data-layout-allow-safe-zone data-slot="visit-line" data-max="28">Mampir ke halamanku</p>
          <p class="name" data-layout-allow-safe-zone data-slot="name-again" data-max="20">TODO-name</p>
          <p class="url" data-layout-allow-safe-zone data-slot="address-again" data-max="34">TODO-address</p>
          <div class="btn-box"><span class="btn" id="visit-btn" data-layout-allow-safe-zone data-slot="button" data-max="18">Buka halamannya</span></div>
        </div>
      </div>
      <script>
        (() => {
          // LOCKED: the words come in, the button is pressed once, the last second holds still.
          const tl = gsap.timeline({ paused: true });
          tl.from("#visit-in", { opacity: 0, y: 24, duration: 0.5, ease: "power2.out" }, 0.05);
          tl.to("#visit-btn", { y: 10, boxShadow: "0 4px 0 #b5381b", duration: 0.12, ease: "power1.in" }, 1.2);
          tl.to("#visit-btn", { y: 0, boxShadow: "0 14px 0 #b5381b", duration: 0.2, ease: "power1.out" }, 1.36);
          window.__timelines["visit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

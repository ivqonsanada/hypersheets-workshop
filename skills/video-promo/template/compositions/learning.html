<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* LOCKED: do not edit the style. Change only the text inside the tags marked data-slot. */
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
        @font-face { font-family: "Finlandica"; src: url("assets/fonts/finlandica-ext.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+20A0-20AB, U+2C60-2C7F, U+A720-A7FF; }
        #root { position: absolute; inset: 0; font-family: "Finlandica", sans-serif; color: #f4ede4; }
        #root .wrap { position: absolute; left: 96px; right: 120px; top: 240px; bottom: 300px; display: flex; flex-direction: column; justify-content: center; transform-origin: 40% 50%; }
        #root .title { font-size: 72px; font-weight: 700; line-height: 1.1; margin-bottom: 88px; }
        #root .item { position: relative; display: flex; align-items: flex-start; gap: 40px; margin-bottom: 64px; }
        #root .chip { flex: none; display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; margin-top: 2px; background: var(--hs-accent, #e44d26); color: var(--hs-ink, #f4ede4); font-family: "JetBrains Mono", monospace; font-size: 44px; font-weight: 700; box-shadow: 8px 8px 0 #0b0908; }
        #root .txt { font-size: 60px; font-weight: 500; line-height: 1.2; }
        #root .txt .w { display: inline-block; }
        #root .flood { position: absolute; left: 0; top: 2px; z-index: 5; display: block; width: 76px; height: 76px; background: var(--hs-accent, #e44d26); transform-origin: 50% 50%; pointer-events: none; }
      </style>
      <div id="root" data-composition-id="learning" data-width="1080" data-height="1920">
        <div class="wrap" id="learning-in">
          <h2 class="title" id="learning-title" data-layout-allow-safe-zone data-slot="list-title" data-max="26">Yang sedang kupelajari</h2>
          <div class="item" id="learning-1"><b class="chip" id="learning-c1" data-layout-allow-safe-zone>1</b><p class="txt" id="learning-t1" data-layout-allow-safe-zone data-slot="item-1" data-max="40">TODO-item-1</p></div>
          <div class="item" id="learning-2"><b class="chip" id="learning-c2" data-layout-allow-safe-zone>2</b><p class="txt" id="learning-t2" data-layout-allow-safe-zone data-slot="item-2" data-max="40">TODO-item-2</p></div>
          <div class="item" id="learning-3"><b class="chip" id="learning-c3" data-layout-allow-safe-zone>3</b><p class="txt" id="learning-t3" data-layout-allow-safe-zone data-slot="item-3" data-max="40">TODO-item-3</p><b class="flood" id="learning-flood" data-layout-ignore></b></div>
        </div>
      </div>
      <script>
        (() => {
          // LOCKED: the list arrives out of the marker that opened over the page, then one line at a
          // time: its number steps in, its words sharpen one by one, and each line then holds still.
          // At the end the third number grows into the page's colour, the last scene's ground.
          const tl = gsap.timeline({ paused: true });

          // Words become separate pieces so they can arrive one after another; spaces stay text,
          // so the lines wrap exactly as before.
          for (const i of [1, 2, 3]) {
            const p = document.getElementById("learning-t" + i);
            const words = p.textContent.trim().split(/(\s+)/);
            p.textContent = "";
            for (const w of words) {
              if (/^\s+$/.test(w)) p.appendChild(document.createTextNode(" "));
              else if (w) { const s = document.createElement("span"); s.className = "w"; s.textContent = w; p.appendChild(s); }
            }
          }

          const stepIn = (n) => (p) => Math.ceil(p * n) / n;
          tl.fromTo("#learning-in", { scale: 1.14, filter: "blur(10px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power3.out" }, 0);
          [0.55, 1.3, 2.05].forEach((at, i) => {
            const n = i + 1;
            tl.fromTo(`#learning-c${n}`, { scale: 0 }, { scale: 1, duration: 0.18, ease: stepIn(3) }, at);
            tl.fromTo(`#learning-t${n} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.06 }, at + 0.08);
          });
          // The flood sits exactly on the third number. From 5.1 s it grows (56 times covers the
          // frame from anywhere the number can be) and its colour becomes the last scene's ground.
          tl.fromTo("#learning-flood", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.1);
          tl.fromTo("#learning-flood", { scale: 1 }, { scale: 56, duration: 0.44, ease: "power3.in" }, 5.12);
          window.__timelines["learning"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
